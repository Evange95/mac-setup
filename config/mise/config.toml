# Global toolchain. Managed by mac-setup (symlinked to ~/.config/mise/config.toml).
# Projects pin their own versions with mise.toml, .nvmrc, .node-version, .python-version or .go-version.
# Update everything with `mise upgrade`.

[tools]
# --- Node.js ---
node = "lts"
pnpm = "latest"
bun = "latest"
"npm:@antfu/ni" = "latest"       # ni / nr / nun: runs npm, pnpm, yarn or bun depending on the lockfile
"npm:tsx" = "latest"
"npm:typescript" = "latest"

# --- Go ---
go = "latest"
golangci-lint = "latest"
# Prebuilt binaries from the mise registry
gofumpt = "latest"
gotestsum = "latest"
air = "latest"
# Not in the registry: compiled with `go install`, so they are rebuilt on every Go upgrade
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

# --- Python ---
python = "3.15.2"
uv = "latest"
ruff = "latest"
"pipx:pre-commit" = "latest"

[settings]
# Read .nvmrc / .node-version / .python-version / .go-version from existing projects
idiomatic_version_file_enable_tools = ["node", "python", "go"]
# Install pipx: tools with uv (fast, no global pip)
pipx.uvx = true
